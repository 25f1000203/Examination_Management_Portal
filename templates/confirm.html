{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card mx-auto mt-4" style="max-width:560px">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <p>{{ message }}</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="btn btn-outline-danger">Yes, continue</button>
      <a class="btn btn-outline-emp" href="{{ back }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
